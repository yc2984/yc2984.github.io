baseURL = 'https://yc2984.github.io/'
languageCode = 'en-gb'
title = 'Yang Cao'
theme = 'cobalt'

enableRobotsTXT = true
capitalizeListTitles = false  # tags read as written: 'ml-infrastructure', not 'Ml-Infrastructure'
summaryLength = 30

[pagination]
  pagerSize = 12

[params]
  # the order the filter chips appear in; anything not listed goes last, A-Z
  label_order = ['Tech', 'Data', 'AI', 'Thoughts', 'Music', 'Art & Science']
  description = "Writing about tech, data and AI — what I built, what broke, and what it cost."
  # comments as GitHub Discussions; remove this table to switch comments off
  # site-wide. The two IDs are GraphQL node IDs, not the names beside them:
  #   gh api repos/yc2984/yc2984.github.io --jq .node_id
  #   gh api graphql -f query='{repository(owner:"yc2984",name:"yc2984.github.io"){discussionCategories(first:20){nodes{id name}}}}'
  [params.giscus]
    repo       = "yc2984/yc2984.github.io"
    repoID     = "R_kgDOK1t7BA"
    # Announcements: only maintainers can open threads, so giscus creates one
    # per page on demand and nobody can spam the category with new ones.
    category   = "Announcements"
    categoryID = "DIC_kwDOK1t7BM4DD9Ew"

  # shown in the top-right of the chrome rail
  [[params.links]]
    name = "GitHub"
    url  = "https://github.com/yc2984"
  [[params.links]]
    name = "LinkedIn"
    url  = "https://www.linkedin.com/in/yangcao"

[[menus.main]]
  name   = "Writing"
  url    = "/posts/"
  weight = 10
[[menus.main]]
  name   = "About"
  url    = "/about/"
  weight = 20

[markup]
  [markup.goldmark.renderer]
    # needed so inline SVG diagrams in a post are rendered, not escaped
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
  [markup.highlight]
    # tonal cobalt highlighting lives in the theme's CSS
    noClasses = false
    lineNos = false
    tabWidth = 2
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false

[taxonomies]
  # top-level filter shown as chips on the home page
  label = 'labels'
  # finer-grained, listed at the foot of a post
  tag = 'tags'
